name: Public robot source

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - {target: linux-amd64, runner: ubuntu-24.04}
          - {target: linux-arm64, runner: ubuntu-24.04-arm}
          - {target: windows-x64, runner: windows-2022}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.0'
          cache-dependency-path: |
            media/go.sum
            service-bridge/go.sum
      - name: Select Rust toolchain
        shell: pwsh
        run: |
          $version = (Get-Content tools/rust-version).Trim()
          rustup toolchain install $version --profile minimal --component clippy --component rustfmt
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          rustup default $version
          exit $LASTEXITCODE
      - name: Check supported interfaces and source
        run: |
          python -m pip install -r tools/contract-requirements.txt
          python tools/build.py --check
      - name: Build native binaries
        run: python tools/build.py
      - name: Generate source SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: .
          syft-version: v1.57.0
          format: spdx-json
          output-file: dist/source-sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: build-evidence-${{ matrix.target }}
          retention-days: 1
          path: dist/source-sbom.spdx.json
          if-no-files-found: error
