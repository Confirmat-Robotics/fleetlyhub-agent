[package]
license = "Apache-2.0"
name = "fleetly-agent"
version = "0.1.10"
edition = "2024"
description = "Fleetly Hub robot connectivity agent"
repository = "https://github.com/Confirmat-Robotics/fleetlyhub-agent"

[[bin]]
name = "fleetlyhub-agent"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.100"
base64 = "0.22"
p256 = { version = "0.13", features = ["ecdsa", "pkcs8", "pem"] }
rcgen = "0.14"
sha2 = "0.10"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
clap = { version = "4.5.48", features = ["derive"] }
futures-util = "0.3.31"
rumqttc = { version = "0.25.1", default-features = false, features = ["use-rustls-no-provider"] }
serde = { version = "1.0.226", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.47.1", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7.16", features = ["codec"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
uuid = { version = "1.18.1", features = ["v4", "serde"] }
x509-parser = "0.18"
tempfile = "3.23"

[dev-dependencies]
pretty_assertions = "1.4.1"
